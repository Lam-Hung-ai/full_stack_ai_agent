# Local development services.
# Start only what the machine lacks, e.g. `docker compose up -d postgres mailpit`.
services:
  postgres:
    image: postgres:18.0
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent_chat
    ports:
      # 5432 is often taken by a system PostgreSQL.
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_chat"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8.2
    ports:
      - "127.0.0.1:6379:6379"

  # S3-compatible storage for chat files (S7). API on 9000, console on 9001;
  # then `uv run storage setup` in backend/ creates the bucket and its CORS.
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.5
    environment:
      RUSTFS_ACCESS_KEY: agentchat
      RUSTFS_SECRET_KEY: agentchat-dev-secret
    command: /data
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - rustfs-data:/data

  # Catches every letter the backend sends (S6); read them at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  postgres-data:
  rustfs-data:
